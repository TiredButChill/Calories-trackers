<div class="min-h-dvh flex flex-col bg-surface-50 dark:bg-surface-950">
    <header class="sticky top-0 z-10 flex items-center justify-between px-4 h-14 bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-800">
        <span class="font-semibold text-surface-900 dark:text-surface-0">Calories Tracker</span>
        <p-button icon="pi pi-sign-out" [text]="true" [rounded]="true" severity="secondary" (onClick)="logout()" />
    </header>

    <main class="flex-1 p-4 pb-24 max-w-xl w-full mx-auto">
        <router-outlet />
    </main>

    <nav class="fixed bottom-0 inset-x-0 z-20 bg-surface-0 dark:bg-surface-900 border-t border-surface-200 dark:border-surface-800 pb-[env(safe-area-inset-bottom)]">
        <div class="max-w-xl mx-auto grid grid-cols-5">
            @for (item of navItems; track item.path) {
                <a
                    [routerLink]="item.path"
                    routerLinkActive
                    #rla="routerLinkActive"
                    [routerLinkActiveOptions]="{ exact: item.exact }"
                    [class.text-primary-500]="rla.isActive"
                    [class.text-surface-500]="!rla.isActive"
                    class="flex flex-col items-center justify-center gap-1 py-2.5"
                >
                    <i class="pi {{ item.icon }} text-lg"></i>
                    <span class="text-xs">{{ item.label }}</span>
                </a>
            }
        </div>
    </nav>
</div>
