<section class="min-h-dvh flex items-center justify-center px-4 bg-surface-50 dark:bg-surface-950">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-primary-500 flex items-center justify-center mb-4">
                <i class="pi pi-bolt text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0">Calories Tracker</h1>
            <p class="text-surface-500 mt-1">Theo dõi calo mỗi ngày, đơn giản và nhanh chóng</p>
        </div>

        <p-card styleClass="shadow-lg rounded-2xl">
            <p-button label="Đăng nhập với Google" icon="pi pi-google" styleClass="w-full" size="large" [loading]="loading()" (onClick)="signIn()" />

            @if (error()) {
                <p class="text-red-500 text-sm text-center mt-4">{{ error() }}</p>
            }
        </p-card>

        <p class="text-center text-surface-400 text-xs mt-6">© {{ currentYear }} Calories Tracker</p>
    </div>
</section>
