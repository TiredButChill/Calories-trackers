<nav class="flex gap-2 overflow-x-auto pb-3 -mx-4 px-4">
    @for (item of subNavItems; track item.path) {
        <a
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [class.bg-primary-500]="rla.isActive"
            [class.text-white]="rla.isActive"
            [class.bg-surface-100]="!rla.isActive"
            [class.dark:bg-surface-800]="!rla.isActive"
            [class.text-surface-700]="!rla.isActive"
            [class.dark:text-surface-200]="!rla.isActive"
            class="shrink-0 px-3 py-1.5 rounded-full text-sm whitespace-nowrap"
        >
            {{ item.labelKey | t }}
        </a>
    }
</nav>

<router-outlet />
