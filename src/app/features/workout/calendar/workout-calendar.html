@if (view$ | async; as view) {
    <div class="flex items-center justify-between mb-4">
        <p-button icon="pi pi-chevron-left" [text]="true" [rounded]="true" (onClick)="previousMonth()" />
        <h1 class="text-lg font-semibold text-surface-900 dark:text-surface-0">{{ view.monthLabel }}</h1>
        <p-button icon="pi pi-chevron-right" [text]="true" [rounded]="true" (onClick)="nextMonth()" />
    </div>

    <div class="grid grid-cols-7 gap-1 text-center text-xs text-surface-400 mb-2">
        <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
    </div>

    <div class="grid gap-1">
        @for (week of view.weeks; track $index) {
            <div class="grid grid-cols-7 gap-1">
                @for (cell of week; track $index) {
                    <button
                        type="button"
                        class="aspect-square rounded-lg flex items-center justify-center text-sm"
                        [class]="cell.status ? statusClass[cell.status] : 'bg-transparent'"
                        [class.ring-2]="cell.date === today"
                        [class.ring-primary-500]="cell.date === today"
                        [disabled]="!cell.date"
                        (click)="openDay(cell.date, cell.status)"
                    >
                        {{ cell.day }}
                    </button>
                }
            </div>
        }
    </div>

    <div class="flex flex-wrap gap-3 mt-4 text-xs text-surface-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-500 inline-block"></span> Hoàn thành</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-surface-200 dark:bg-surface-700 inline-block"></span> Đã lên lịch</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-200 dark:bg-red-900 inline-block"></span> Bỏ lỡ</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded border border-surface-300 inline-block"></span> Nghỉ</span>
    </div>
}
