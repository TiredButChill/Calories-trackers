<h1 class="text-lg font-semibold text-surface-900 dark:text-surface-0 mb-4">Lịch sử tập luyện</h1>

<div class="grid gap-2">
    @for (session of sessions$ | async; track session.date) {
        <a [routerLink]="['/workout/history', session.date]">
            <p-card styleClass="rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-medium text-surface-900 dark:text-surface-0">{{ session.templateName }}</div>
                        <div class="text-sm text-surface-500">{{ session.date }}</div>
                        <div class="text-xs text-surface-400 mt-1">{{ sessionSetCount(session) }} sets · {{ sessionRepCount(session) }} reps · {{ sessionVolume(session) }} kg</div>
                    </div>
                    <p-tag value="Hoàn thành" severity="success" />
                </div>
            </p-card>
        </a>
    } @empty {
        <p class="text-center text-surface-400 py-10">Chưa có buổi tập nào hoàn thành</p>
    }
</div>
